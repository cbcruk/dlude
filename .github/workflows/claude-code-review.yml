name: Claude Code Review

# PR을 열거나 초안에서 준비 완료로 바꿀 때 한 번 리뷰한다(hemr와 같음). 고친 뒤 다시 보려면 PR에 `@claude`로 요청한다.
# 리뷰 기준은 REVIEW.md. 저장소 비밀 값 CLAUDE_CODE_OAUTH_TOKEN이 없으면 건너뛰고 CI를 막지 않는다.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: 인증 값 확인
        id: auth
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN이 없어 리뷰를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.auth.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            저장소: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            이 PR을 리뷰한다. 기준은 REVIEW.md다. 작성 세션의 결론은 받지 않는다. diff와 문서만 본다.

            1. CLAUDE.md와 REVIEW.md를 읽는다. `gh pr view ${{ github.event.pull_request.number }}`로 본문을 읽고,
               연결된 `docs/features/<기능>/spec.md`·`plan.md`를 읽는다.
            2. `gh pr diff ${{ github.event.pull_request.number }}`로 변경 전체를 읽는다. 바뀐 파일마다 해당 설계 문서
               (docs/design/, docs/architecture.md)를 읽는다. 판정에 필요하면 저장소의 다른 코드도 Read·Grep으로 읽는다.
            3. REVIEW.md "사람이 보는 두 질문"에 답한다: plan대로인가(plan 밖 파일, 빠진 테스트), 남은 위험이 받아들일 만한가.
            4. 지적마다 코드로 다시 확인한다. 확인하지 못한 것은 버리거나 "확인 못 함"이라고 적는다.
               이 PR이 만들지 않은 기존 문제, prettier·tsc가 잡는 것은 지적하지 않는다.
            5. 확인한 지적은 그 줄에 `mcp__github_inline_comment__create_inline_comment`로 남긴다. 처음에 **막음** 또는
               **후속**을 붙인다. 후속은 5개까지. 어떤 입력에서 어떻게 틀리는지와 근거 문서·코드를 적는다.
            6. 마지막에 `gh pr comment`로 요약 하나를 남긴다. 두 질문의 답, 읽은 문서, 막음·후속 개수와 한 줄 요약.

            모든 리뷰 글은 한국어로 쓴다. 식별자·오류 코드·이벤트 타입은 영어 그대로 쓴다.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
